services:
  - type: web
    name: brandrise-newsletter-admin
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && gunicorn admin:app --bind 0.0.0.0:$PORT --workers 1 --timeout 900
    envVars:
      - key: RENDER
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GIT_USER_NAME
        sync: false
      - key: GIT_USER_EMAIL
        sync: false
