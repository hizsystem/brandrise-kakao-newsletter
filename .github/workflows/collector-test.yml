name: Collector Test
# 수동 실행 전용 — 발행 없이 뉴스 큐레이션 수집기만 러너에서 돌려본다.
# (RSS 피드·Claude API가 GitHub Actions 러너에서 접근 가능한지 검증용)
on:
  workflow_dispatch:

jobs:
  collector-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run curated news collector (no publish)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bootstrap.py
          python -m collectors.curated_news
      - name: Builder Josh feed resolution (no publish)
        run: |
          python -c "from collectors.builder_josh import fetch_latest_url; r = fetch_latest_url(); print('feed latest:', r); assert r and r[0].startswith('https://maily.so/'), 'feed resolution failed'"
