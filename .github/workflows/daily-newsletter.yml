name: Daily Newsletter
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env literal test
        env:
          GIT_USER_NAME: brandrise-bot
          GIT_USER_EMAIL: bot@brandrise.local
        run: echo "$GIT_USER_NAME literal-ok"
      - name: secret test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: echo "secret-len=${#ANTHROPIC_API_KEY}"
