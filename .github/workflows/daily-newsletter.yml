name: Daily Newsletter
on:
  schedule:
    # 목표 도착: 10:00 KST(=01:00 UTC) 월~금.
    # 이 값(23:30 UTC)은 명목 시각이 아니라 도착 시각을 맞춘 것이다.
    # GitHub은 schedule 이벤트를 고부하 시 지연 발화하며, 이 리포는 실측 6회 전부
    # 84~108분(평균 97분) 늦게 떴다(run created_at 기준. 러너 대기는 2초로 무관).
    # 따라서 23:30 UTC + ~97분 → 09:54~10:17 KST 도착.
    # 01:00 UTC로 바꾸면 명목상 10:00이지만 실제 도착은 ~11:30이 된다(2026-07-14~15 실측).
    # 시각을 손대기 전에 반드시 `gh run list --json createdAt,event`로 실제 발화 시각을 측정할 것.
    - cron: "30 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate and publish newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GIT_USER_NAME: brandrise-bot
          GIT_USER_EMAIL: bot@brandrise.local
        run: |
          python bootstrap.py
          python main.py --now
      - name: Slack notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python slack_notify.py
